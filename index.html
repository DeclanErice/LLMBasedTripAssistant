<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TripGenius - AI旅行规划师</title>
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1>TripGenius</h1>
            <p class="tagline">你的AI旅行规划师</p>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Input Section -->
            <section class="input-section">
                <div class="form-group">
                    <label for="destination">目的地</label>
                    <input type="text" id="destination" placeholder="例如：日本、厦门、重庆" />
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="days">天数</label>
                        <input type="number" id="days" min="1" max="30" value="3" />
                    </div>
                    <div class="form-group">
                        <label for="budget">预算 (元)</label>
                        <input type="number" id="budget" min="0" value="5000" />
                    </div>
                </div>

                <div class="form-group">
                    <label>旅行风格</label>
                    <div class="style-options">
                        <label class="style-option">
                            <input type="radio" name="style" value="chill" checked />
                            <span class="style-card">
                                <span class="style-icon">🌿</span>
                                <span class="style-name">休闲</span>
                            </span>
                        </label>
                        <label class="style-option">
                            <input type="radio" name="style" value="美食" />
                            <span class="style-card">
                                <span class="style-icon">🍜</span>
                                <span class="style-name">美食</span>
                            </span>
                        </label>
                        <label class="style-option">
                            <input type="radio" name="style" value="打卡" />
                            <span class="style-card">
                                <span class="style-icon">📍</span>
                                <span class="style-name">打卡</span>
                            </span>
                        </label>
                        <label class="style-option">
                            <input type="radio" name="style" value="出片" />
                            <span class="style-card">
                                <span class="style-icon">📷</span>
                                <span class="style-name">出片</span>
                            </span>
                        </label>
                    </div>
                </div>

                <button id="generateBtn" class="btn-primary">
                    <span class="btn-text">生成行程</span>
                    <span class="btn-loading" style="display: none;">生成中...</span>
                </button>
            </section>

            <!-- Result Section -->
            <section id="resultSection" class="result-section" style="display: none;">
                <div class="result-header">
                    <h2 id="resultTitle">行程规划</h2>
                    <button id="resetBtn" class="btn-secondary">重新规划</button>
                </div>
                <div id="resultContent" class="result-content">
                    <!-- 结果内容会动态插入 -->
                </div>
            </section>

            <!-- Loading State -->
            <div id="loadingOverlay" class="loading-overlay" style="display: none;">
                <div class="loading-spinner"></div>
                <p>正在为您规划完美行程...</p>
            </div>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>Powered by MiniMax + RAG | 仅供学习研究使用</p>
        </footer>
    </div>

    <script src="assets/app.js"></script>
</body>
</html>
